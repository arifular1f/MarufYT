name: Build

# Builds the MarufYT ROOTLESS package. No YouTube IPA is downloaded or
# published here; IPAs are assembled locally from a user-supplied decrypted
# YouTube (see Documentation/BUILD_INSTRUCTIONS.md).
#
# Hardening (see SECURITY.md):
# - read-only token, no secrets used, credentials never persisted to disk;
# - every action pinned to a full commit SHA (tag in the trailing comment);
# - source, submodules, compiler and SDK use the reviewed integrity lock;
# - no untrusted event data is interpolated into shell commands.

on:
  push:
    branches: [main, phase2, 'stable-*', 'migrate/*', 'phase3-*', 'phase4-*']
  pull_request:
  workflow_dispatch:
    inputs:
      audit_only:
        description: Validate security and pinned tooling without building release packages
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0 # full history for the secret scan
      - name: Upstream packaging tests and native layout tests
        env:
          # The native layout tests need a C compiler; fail instead of skipping.
          MARUFYT_REQUIRE_NATIVE: '1'
        run: python3 -m unittest discover -s Tests -v
      - name: MarufYT source checks
        run: python3 Tools/marufyt_checks.py
      - name: Secret scan (all history reachable from this checkout)
        run: python3 Tools/marufyt_secret_scan.py

  build:
    needs: test
    # Theos' installer needs the libxml2 apt package, which Ubuntu 26.04
    # (ubuntu-latest since 2026-10) renamed.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      THEOS: ${{ github.workspace }}/.theos
      CI: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Cache verified download archives only
        id: cache-theos
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.toolchain-downloads
          key: marufyt-archives-${{ hashFiles('Tools/toolchain.lock.json') }}

      - name: Install signed host packages and pinned Theos tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl zip git libxml2 libtinfo6 xz-utils
          python3 Tools/bootstrap_pinned.py --theos "$THEOS" --report toolchain-provenance.json

      - name: Demonstrate isolated LGPL object replacement and relinking
        if: inputs.audit_only == true
        run: python3 Tools/relink_probe.py --theos "$THEOS" --output relink-evidence

      - name: Record toolchain provenance
        run: |
          {
            echo "theos commit: $(git -C "$THEOS" rev-parse HEAD)"
            echo "sdks: $(ls "$THEOS/sdks" 2>/dev/null | tr '\n' ' ')"
            echo "clang: $("$THEOS/toolchain/linux/iphone/bin/clang" --version 2>/dev/null | head -1)"
          } | tee provenance.txt

      - name: Build ROOTLESS package
        if: inputs.audit_only != true
        run: |
          set -o pipefail
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless \
            MARUFYT_BUILD="$GITHUB_RUN_NUMBER" \
            DISABLE_ROOTLESS_COMPAT_WARNING=1 2>&1 | tee build.log

      - name: Collect artifacts
        if: inputs.audit_only != true
        run: |
          set -euo pipefail
          version="$(awk '/^Version:/ {print $2}' control)"
          mkdir -p artifacts
          cp "$(ls packages/*.deb | head -1)" "artifacts/com.arifular1f.marufyt_${version}_rootless.deb"
          cp dist/MarufYT.dylib build.log provenance.txt toolchain-provenance.json artifacts/
          (cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.audit_only != true
        with:
          name: MarufYT-rootless
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload audit-only tooling and relink evidence
        if: always() && inputs.audit_only == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MarufYT-toolchain-relink-audit
          path: |
            toolchain-provenance.json
            provenance.txt
            relink-evidence/
          if-no-files-found: error
          retention-days: 30
